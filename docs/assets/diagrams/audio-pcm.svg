<svg xmlns="http://www.w3.org/2000/svg" width="605pt" height="439pt" viewBox="0.00 0.00 604.99 439.40" role="img" aria-labelledby="audio-pcm-title audio-pcm-description">
<title id="audio-pcm-title">HD Audio PCM playback and silence reclamation</title><desc id="audio-pcm-description">Programs submit 16-bit stereo samples through nonblocking syscall 0x3f writes. The kernel copies accepted samples into a 128 KiB ring, leaving a 1 KiB guard; a four-entry descriptor list feeds controller DMA and the codec. Timer ticks and syscall calls poll LPIB and zero already played samples.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 417.8)">
