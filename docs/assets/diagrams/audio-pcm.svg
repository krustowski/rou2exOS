<text text-anchor="middle" x="144.52" y="-374.98" font-family="DejaVu Sans" font-size="14.00" fill="#e2e8f0">Userland audio producer</text>
<text text-anchor="middle" x="144.52" y="-357.73" font-family="DejaVu Sans" font-size="14.00" fill="#e2e8f0">16-bit stereo PCM</text>
</g>

