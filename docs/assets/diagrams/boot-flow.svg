<title id="boot-flow-title">From GRUB to scheduled tasks</title><desc id="boot-flow-description">GRUB loads the kernel and archive; the 32-bit assembly entry sets up paging and the GDT, enters long mode, and calls kernel_main. Rust adopts the archive, initializes subsystems and starts scheduling.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 617.73)">
