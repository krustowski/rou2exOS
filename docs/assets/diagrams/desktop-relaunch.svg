<svg xmlns="http://www.w3.org/2000/svg" width="403pt" height="670pt" viewBox="0.00 0.00 402.99 669.92" role="img" aria-labelledby="desktop-relaunch-title desktop-relaunch-description">
<title id="desktop-relaunch-title">Coordinated Memento relaunch</title><desc id="desktop-relaunch-description">Jug verifies the installed Memento update and asks for confirmation, then requests relaunch via syscall 0x42. Memento accepts after unlocking, closes its windows and children, and exits with 0x4d52. The parked init_rc supervisor starts the replacement with preserved arguments and --relaunch. RAM disk files and background services survive.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 648.32)">
