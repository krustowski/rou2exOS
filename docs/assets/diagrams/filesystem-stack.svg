<title id="filesystem-stack-title">VFS mounts and storage backends</title><desc id="filesystem-stack-description">Filesystem syscalls resolve through the VFS. Writable floppy and RAM disk mounts use FatDev and the FAT implementation over BlockDevice. Read-only CD and boot archive mounts share RoFs; tar is read directly from memory.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 401.3)">
