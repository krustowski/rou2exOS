<title id="heap-growth-title">Shared user-heap growth</title><desc id="heap-growth-description">Allocations first search the 4 MiB base heap. If no block fits, a one-time extension is placed using usable RAM, avoiding the boot archive and RAM disk, and mapped USER plus WRITE into kernel and live process page tables. Allocation retries over both regions or fails if no usable space remains.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 480.64)">
