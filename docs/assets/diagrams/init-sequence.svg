<title id="init-sequence-title">Ordered subsystem initialization</title><desc id="init-sequence-description">The 18 initialization steps run in order: console and CPU, interrupts and boot tags, USB and PS/2, memory and video, mounts and splash, processes and debug log, then PIT interrupts. INIT.RC runs as a scheduled task afterwards.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 648.32)">
