<title id="jug-publication-title">Jug publication and catalog commit</title><desc id="jug-publication-description">The developer snapshots and checks ELF bytes, transfers them over SSH, and the receiver stages and verifies them before locking and merging the catalog. Immutable binaries are flushed before sums.txt is atomically switched last. HTTP verification follows the commit; old catalogs remain backed by retained versions.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 618.98)">
