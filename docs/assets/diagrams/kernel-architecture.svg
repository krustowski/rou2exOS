<title id="kernel-architecture-title">Kernel and userland responsibilities</title><desc id="kernel-architecture-description">Applications and userland TCP/IP stacks use SDK libraries and the int 0x7f ABI. The kernel owns scheduling, memory, filesystems and device access. Hardware interrupts also enter the kernel.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 401.3)">
