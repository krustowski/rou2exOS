<title id="memento-architecture-title">Memento UI and hosted programs</title><desc id="memento-architecture-description">Memento's session and windows use the platform layer and r2 backend. Hosted applications run in separate processes and exchange input and frames through shared-heap blocks. Memento owns the desktop composition while each child owns its execution and runtime.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 418.55)">
