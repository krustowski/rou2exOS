<title id="memento-network-mux-title">Memento's single-reader network mux</title><desc id="memento-network-mux-description">Only netmux reads Memento's kernel frame queue. It routes to the embedded web networking stack, libcr2's Chat and IRC stack, and the Network window's probe client. ARP is copied to interested clients. Hosted applications such as r2web have their own process queues.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 253.87)">
