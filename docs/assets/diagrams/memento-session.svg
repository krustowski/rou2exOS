<title id="memento-session-title">Memento session and lock screen</title><desc id="memento-session-description">A normal launch without saved credentials enters Hello, then Login and Desktop. Relaunch or saved credentials skip Hello; saved credentials use a Locked dialog. Locking overlays the desktop while windows keep running. Hello offers restart and power off, Login cancellation restarts, and the lock screen offers restart and power off.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 550.3)">
