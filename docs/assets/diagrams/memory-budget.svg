<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="memory-budget-title memory-budget-description"><title id="memory-budget-title">Fixed memory pool capacities</title><desc id="memory-budget-description">Linear horizontal bars: ELF frames 64 MiB; initial user stacks 4 MiB; base user heap 4 MiB; kernel stacks 1 MiB; page tables 0.5 MiB. These are reserved pool capacities, not runtime usage.</desc><rect width="800" height="350" rx="12" fill="#0f172a" /><text x="24" y="31" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Fixed memory pools</text><text x="24" y="53" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">Reserved capacity · linear scale in MiB</text><line x1="223.0" y1="70" x2="223.0" y2="288" stroke="#334155" /><text x="223.0" y="310" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">0</text><line x1="311.0" y1="70" x2="311.0" y2="288" stroke="#334155" /><text x="311.0" y="310" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">16</text><line x1="399.0" y1="70" x2="399.0" y2="288" stroke="#334155" /><text x="399.0" y="310" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">32</text><line x1="487.0" y1="70" x2="487.0" y2="288" stroke="#334155" /><text x="487.0" y="310" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">48</text><line x1="575.0" y1="70" x2="575.0" y2="288" stroke="#334155" /><text x="575.0" y="310" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">64</text><text x="24" y="99" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">ELF physical frames</text><rect x="223" y="82" width="352.0" height="24" fill="#60a5fa" /><text x="583.0" y="99" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">64 MiB</text><text x="776" y="99" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="end">32 × 2 MiB</text><text x="24" y="142" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">Initial user stacks</text><rect x="223" y="125" width="22.0" height="24" fill="#2dd4bf" /><text x="253.0" y="142" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">4 MiB</text><text x="776" y="142" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="end">32 × 128 KiB</text><text x="24" y="185" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">Base shared user heap</text><rect x="223" y="168" width="22.0" height="24" fill="#2dd4bf" /><text x="253.0" y="185" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">4 MiB</text><text x="776" y="185" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="end">4 MiB</text><text x="24" y="228" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">Kernel stack pool</text><rect x="223" y="211" width="5.5" height="24" fill="#c4b5fd" /><text x="236.5" y="228" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">1 MiB</text><text x="776" y="228" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="end">32 × 32 KiB</text><text x="24" y="271" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">Page-table pool</text><rect x="223" y="254" width="2.75" height="24" fill="#c4b5fd" /><text x="233.75" y="271" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">0.5 MiB</text><text x="776" y="271" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="end">128 × 4 KiB</text><text x="24" y="335" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="14">Excludes kernel image, boot archive, RAM disk and heap extension.</text></svg>
