<title id="network-layers-title">Userland stacks and kernel transports</title><desc id="network-layers-description">TCP/IP connection state lives in userland. Raw Ethernet syscalls pass through the kernel's tunnel, loopback and NIC routing; the legacy serial path carries SLIP-framed IPv4. Stateless protocol helpers support the kernel routing code.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 334.46)">
