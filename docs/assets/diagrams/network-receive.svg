<svg xmlns="http://www.w3.org/2000/svg" width="607pt" height="452pt" viewBox="0.00 0.00 606.74 451.90" role="img" aria-labelledby="network-receive-title network-receive-description">
<title id="network-receive-title">NIC receive ownership and backpressure</title><desc id="network-receive-description">Every timer tick polls up to 16 frames. A frame is peeked, routed and copied to an owned buffer, then queued before the NIC ring is consumed. Queue failure holds the frame for retry; an unresponsive receiver has a 200-tick limit. Receive copies the frame and frees its buffer.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 430.3)">
