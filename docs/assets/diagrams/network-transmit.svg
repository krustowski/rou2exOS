<title id="network-transmit-title">Ethernet transmit routing order</title><desc id="network-transmit-description">Raw Ethernet send checks tunnel routing before loopback and the physical NIC. A tunnel-selected frame is queued to wgd or returns Busy. A local frame is delivered without the NIC. Remaining frames go to the selected NIC backend.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 515.14)">
