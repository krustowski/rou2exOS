<svg xmlns="http://www.w3.org/2000/svg" width="771pt" height="369pt" viewBox="0.00 0.00 770.82 368.57" role="img" aria-labelledby="process-states-title process-states-description">
<title id="process-states-title">Process states and slot reuse</title><desc id="process-states-description">A free slot becomes Ready, then Running. Preemption returns it to Ready; sleep or receive blocks it; a foreground launcher waits Idle. Exit or kill marks Dead and reaps the slot. A crash retains a Crashed slot until reused when the table is full.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 346.97)">
