<title id="sdk-pipeline-title">SDK build and execution pipeline</title><desc id="sdk-pipeline-description">C, C++ and TinyGo programs use their libraries and target configuration to produce a static ELF64 image. The image is staged on a boot medium or downloaded by Jug, loaded into a slot's private frame, and calls the kernel through int 0x7f.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 483.64)">
