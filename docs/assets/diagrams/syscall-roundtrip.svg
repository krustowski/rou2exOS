<svg xmlns="http://www.w3.org/2000/svg" width="358pt" height="540pt" viewBox="0.00 0.00 357.99 539.74" role="img" aria-labelledby="syscall-roundtrip-title syscall-roundtrip-description">
<title id="syscall-roundtrip-title">int 0x7f syscall round trip</title><desc id="syscall-roundtrip-description">A ring-3 SDK wrapper supplies RAX, RDI, RSI and optional RCX. The interrupt gate enters ring 0 on the process kernel stack; the entry stub calls syscall_inner, which validates and dispatches the request. The stub restores registers and returns with iretq; RAX carries the result and R9 is clobbered.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 518.14)">
