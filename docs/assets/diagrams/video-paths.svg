<title id="video-paths-title">Text and framebuffer session paths</title><desc id="video-paths-description">Boot information selects the output path. A graphics kernel with an RGB framebuffer starts supervised Memento and uses palette-indexed blits to the linear framebuffer. Text sessions run the shell and clock in VGA text memory; manually launched Memento changes VGA to planar graphics and writes the mapped VRAM.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 290.28)">
