<title id="wireguard-path-title">WireGuard inner and outer packet paths</title><desc id="wireguard-path-description">A tunnel-source packet matching AllowedIPs is routed to wgd, encrypted into outer UDP and sent through the NIC. The reverse path sends registered-port UDP to wgd for authentication, decryption and source-prefix checks, then injects supported inner packets for TCP services or shell probes.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 376.21)">
