site_name: rou2exOS Rusted Edition Documentation
site_url: "https://r2.krusty.space"
site_description: "Build, use and develop rou2exOS, with SDK and kernel ABI references."
repo_url: "https://github.com/krustowski/rou2exOS"
repo_name: krustowski/rou2exOS
dev_addr: 0.0.0.0:8009

# Theme templates live under docs but are not published as static pages.
exclude_docs: |
  /docs_theme/

theme:
  name: material
  custom_dir: docs/docs_theme
  language: en
  palette:
    scheme: slate
    primary: blue
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

copyright: "@krusty.space 2026 --- Note: Some portions of this documentation have been generated from the original source code by AI."

extra:
  homepage: "https://r2.krusty.space"
  social:
    - icon: fontawesome/brands/github
      link: "https://github.com/krustowski/rou2exOS"

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code

# Keep missing pages, downloads and heading links visible in strict builds.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

extra_javascript:
  - assets/js/umami.js

extra_css:
  - assets/stylesheets/navigation.css

nav:
  - Home: index.md
  - Getting Started:
    - Build & Run: build.md
    - Kernel Shell: shell.md
  - SDK:
    - sdk/index.md
    - Languages & Libraries:
      - C (libcr2): sdk/libcr2.md
      - C++ (libc++r2): sdk/libcxxr2.md
      - Go (libgor2): sdk/libgor2.md
      - TCC (C on r2): sdk/tcc.md
    - Applications:
      - Application Suite: sdk/apps.md
      - Memento Desktop: sdk/memento.md
      - Jug Program Manager: sdk/jug.md
      - Publishing Jug Programs: sdk/jug-publishing.md
  - Kernel Internals:
    - kernel.md
    - Boot / Init:
      - init/overview.md
      - Subsystems: init/subsystems.md
    - Multitasking:
      - Scheduler: multitasking/scheduler.md
      - Processes: multitasking/process.md
      - IPC: multitasking/IPC.md
    - Memory:
      - memory/overview.md
      - Allocators: memory/allocators.md
    - Filesystems:
      - filesystem/overview.md
      - FAT12 & FAT16: filesystem/fat12.md
      - ISO9660: filesystem/iso9660.md
    - Networking:
      - RNTP network disk: networking/rntp.md
      - networking/overview.md
      - Hardware: networking/hardware.md
      - Protocols: networking/protocols.md
      - WireGuard: networking/wireguard.md
    - Video:
      - video/overview.md
      - VGA: video/vga.md
    - Audio:
      - HD Audio: audio/hda.md
    - Input:
      - input/overview.md
      - Keyboard: input/keyboard.md
      - Mouse: input/mouse.md
  - ABI / Syscalls:
    - abi/syscall_specification.md
    - Type Definitions: abi/type_definitions.md
    - Syscalls:
      - System, Processes & Memory: abi/syscalls/sysinfo_mem_mgmt.md
      - Video & Audio: abi/syscalls/video_audio.md
      - Filesystem: abi/syscalls/filesystem.md
      - Ports & Networking: abi/syscalls/port_networking.md
